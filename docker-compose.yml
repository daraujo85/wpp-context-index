services:
  wpp-context:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - VISION_MODEL=${VISION_MODEL:-gemma4:12b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - INGEST_CONCURRENCY=${INGEST_CONCURRENCY:-1}
      - MEDIA_CONCURRENCY=${MEDIA_CONCURRENCY:-1}
      - CONVERSATION_GAP_MINUTES=${CONVERSATION_GAP_MINUTES:-20}
    tmpfs:
      - /tmp/wpp-media
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage

volumes:
  qdrant-storage:
